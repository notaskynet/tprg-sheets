[guide]
concept = """
На этом шаге нужно записать самое основное. Обязательны только имя и концепция.

Имя: как героя называют сейчас, это может быть человеческое имя, прозвище или псевдоним. Концепция: одна строка о том, кем человек был до Становления и кем стал, например «Марта Ковальская, медсестра в ночную смену».

Натура это то, какой герой на самом деле, Маска это то, каким он хочет казаться. Выберите значение из списка или впишите своё. Мягкая Маска поверх жестокой Натуры обычно даёт интересного героя.

В поле «Свободные очки» впишите, сколько очков разрешил мастер. Обычно это 15, и это число уже стоит по умолчанию. Всё остальное можно поменять позже на листе.
"""
clan = """
Выберите клан в списке. Под названием написано, чем он известен. От клана зависят три клановые дисциплины, которые обычно берут первыми, и клановая слабость, проклятие всех его членов. Если не уверены, прочитайте описания в списке и выберите клан, который подходит вашей концепции.

Поколение определяет запас крови. По умолчанию стоит 13, оставьте его, если мастер не сказал другое. Чем число меньше, тем больше запас крови. Поле «Сир» можно оставить пустым.

Каитифы не имеют клана и могут брать любые дисциплины.
"""
attributes = """
Атрибуты это врождённые данные героя. Их девять, по три в группах: Физические (Сила, Ловкость, Выносливость), Социальные (Харизма, Манипулирование, Внешность) и Ментальные (Восприятие, Интеллект, Сообразительность). Каждый атрибут уже стоит на 1.

Вам нужно решить, какая группа главная. Главной группе дайте 7 дополнительных точек, второй 5, третьей 3. Просто ставьте точки на атрибутах: счётчик сам определит, какая группа какая, и покажет, сколько точек осталось.

1 это слабо, 3 хорошо, 5 предел человеческих возможностей. Если вложите больше, лишнее спишется из свободных очков на последнем шаге.
"""
abilities = """
Способности это то, чему герой научился. Их три группы: Таланты, Навыки и Знания. Каждая способность начинается с 0.

Как и с атрибутами, выберите главную группу. Ей дайте 13 точек, второй 9, третьей 5. Счётчик сам определит порядок по тому, куда вы вложили больше.

На этом шаге в одну способность можно вложить не больше 3 точек. Чтобы поднять выше, придётся потратить свободные очки. Ориентируйтесь на концепцию: медсестре пригодятся Эмпатия и Медицина.
"""
disciplines = """
Дисциплины это сверхъестественные силы вампира. У вас 3 точки. Обычно их тратят на клановые дисциплины, они показаны в списке первыми. Можно поставить по одной точке в каждую из трёх или все три в одну.

Первый уровень даёт базовую силу, пятый настоящее мастерство. Каитифы выбирают любые дисциплины. Если потратите больше трёх точек, лишнее спишется из свободных очков.
"""
backgrounds = """
Преимущества это то, что у героя есть в мире помимо навыков: союзники, деньги, связи, наставник, убежище. У вас 5 точек. Добавьте преимущество из списка и поставьте ему точки.

Берите то, что поддерживает концепцию: фиксеру нужны Контакты, аристократу Ресурсы и Статус.
"""
virtues = """
Добродетели это моральный компас героя. Их три: Совесть, Самоконтроль и Смелость. Каждая уже стоит на 1, добавьте ещё 7 точек.

Совесть и Самоконтроль вместе дают Человечность, Смелость даёт Волю. Высокая Человечность помогает сдерживать Зверя, высокая Воля помогает держаться, когда становится трудно.
"""
freebies = """
На этом шаге можно докупить что угодно за свободные очки. Их число вы указали на первом шаге, обычно это 15. Цена одной точки: атрибут 5, способность 2, дисциплина 7, преимущество 1, добродетель 2, Воля 1, Человечность 2.

Всё, что вы вложили сверх бюджетов прошлых шагов, списывается отсюда само, считать вручную не нужно. Тратить все очки необязательно. Если счётчик стал красным, вы потратили больше, чем есть: вернитесь назад и уберите лишнее.
"""
recap = "Пройдите по списку. Пункт с крестиком ещё требует внимания: нажмите на него, и вы вернётесь на нужный шаг. Можно закончить и с открытыми пунктами, а поправить их потом на листе."

