[guide]
concept = """
**Начните с идеи, а не с цифр.** Спросите себя: кем был этот человек до Становления и чего он хочет теперь?

- Для начала хватит **имени и концепта**. Пример: *«Марта Ковальская, медсестра в ночную смену»*.
- **Натура**: кто он на самом деле; **Маска**: какое лицо он показывает. Мягкая Маска поверх безжалостной Натуры даёт отличного персонажа.
- Всё это можно изменить позже."""
clan = """
**Клан — это ваша вампирская семья.** Он определяет, какие три дисциплины даются вам легко и какое проклятие вы несёте.

- Прочитайте короткое описание под каждым кланом и выберите подходящий вашему концепту.
- **Поколение** для новых персонажей 13, если мастер не сказал иначе. От него зависит запас крови.
- **Каитиф** без клана могут выбирать любые дисциплины."""
attributes = """
**Атрибуты — это то, на что вы способны от природы.** Каждый атрибут начинается с 1.

- Выберите, какая группа важнее всего: она получит **7** точек, следующая **5**, последняя **3**.
- Физические: Сила, Ловкость, Выносливость. Социальные: Харизма, Манипулирование, Внешность. Ментальные: Восприятие, Интеллект, Сообразительность.
- 1 слабо, 2 средне, 3 хорошо, 4 отлично, 5 вершина человеческих возможностей."""
abilities = """
**Способности — это то, чему вы научились.** Они начинаются с 0.

- Снова выберите главную, второстепенную и третьестепенную группы: **13 / 9 / 5** точек между Талантами, Навыками и Знаниями.
- Не больше **3** точек в одной способности на этом шаге (больше можно купить за свободные очки).
- Опирайтесь на концепт: медсестре пригодятся Эмпатия и Медицина."""
disciplines = """
**Дисциплины — ваши сверхъестественные силы.**

- Потратьте **3** точки, обычно на клановые дисциплины (быстрый выбор показывает их первыми).
- Частые варианты: по одной точке в трёх разных дисциплинах или три точки в одной.
- Силы открываются по уровням: 1 — лишь проба, 5 — мастерство."""
backgrounds = """
**Преимущества — то, что у вас есть в мире помимо ваших навыков.**

- Потратьте **5** точек на союзников, деньги, связи, наставника, убежище…
- Подумайте, что поддерживает ваш концепт: фиксеру нужны Контакты, аристократу Ресурсы и Статус.
- Будьте готовы объяснить каждый пункт одной фразой."""
virtues = """
**Добродетели — ваш моральный компас.**

- Вы получаете **7** точек сверх начальной 1 в каждой.
- Совесть + Самоконтроль дают **Человечность**; Смелость даёт **Волю**.
- Высокая Человечность сдерживает Зверя, высокая Воля помогает превозмогать."""
freebies = """
**Свободные очки нужны для тонкой настройки.** У вас их **15**.

- Цена лишней точки: атрибут 5, способность 2, дисциплина 7, преимущество 1, добродетель 2, Воля 1, Человечность 2.
- Всё, что вы поставили сверх прежних бюджетов, списывается здесь автоматически.
- Тратить все очки необязательно."""
recap = """
**Последний взгляд.** Всё, что отмечено крестиком, ещё требует внимания.

- Нажмите на незакрытый пункт, чтобы перейти на его шаг.
- Можно завершить с открытыми пунктами и поправить их позже на листе."""
