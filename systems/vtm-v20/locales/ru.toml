[guide]
concept = """
Для начала хватит имени и одной строки о том, кто это, например «Марта Ковальская, медсестра в ночную смену». Подумайте, кем человек был до Становления и чего хочет теперь.

Натура это то, каким он является на самом деле, Маска это то, каким он хочет казаться. Мягкая Маска поверх жестокой Натуры обычно даёт интересного персонажа. Всё это можно поменять позже."""
clan = """
Клан определяет три клановые дисциплины и слабость, которую несут все его члены. Прочитайте описания и выберите тот, что подходит вашему концепту.

Поколение у новых персонажей 13, если мастер не назвал другое. Чем оно меньше, тем больше запас крови. Каитиф не имеют клана и могут брать любые дисциплины."""
attributes = """
Атрибуты это врождённые данные, каждый начинается с 1. Выберите главную группу: она получит 7 точек, вторая 5, третья 3.

Физические: Сила, Ловкость, Выносливость. Социальные: Харизма, Манипулирование, Внешность. Ментальные: Восприятие, Интеллект, Сообразительность. 1 это слабо, 3 хорошо, 5 предел человеческих возможностей."""
abilities = """
Способности это то, чему персонаж научился, они начинаются с 0. Снова расставьте приоритеты: 13 точек главной группе, 9 следующей, 5 последней (Таланты, Навыки, Знания).

На этом шаге в одну способность можно вложить не больше 3 точек, больше только за свободные очки. Ориентируйтесь на концепт: медсестре пригодятся Эмпатия и Медицина."""
disciplines = """
Дисциплины это сверхъестественные силы. У вас 3 точки, обычно их тратят на клановые дисциплины (быстрый выбор показывает их первыми).

Можно взять по одной точке в трёх дисциплинах или все три в одной. Первый уровень даёт пробу силы, пятый настоящее мастерство."""
backgrounds = """
Преимущества это то, что у персонажа есть в мире помимо навыков: союзники, деньги, связи, наставник, убежище. Вам даётся 5 точек.

Берите то, что поддерживает концепт: фиксеру нужны Контакты, аристократу Ресурсы и Статус."""
virtues = """
Добродетели это моральный компас. К начальной единице в каждой добавьте 7 точек.

Совесть и Самоконтроль вместе дают Человечность, Смелость даёт Волю. Высокая Человечность помогает сдерживать Зверя, высокая Воля помогает держаться, когда становится трудно."""
freebies = """
Здесь 15 свободных очков для тонкой настройки. Цена одной точки: атрибут 5, способность 2, дисциплина 7, преимущество 1, добродетель 2, Воля 1, Человечность 2.

Всё, что вы вложили сверх бюджетов прошлых шагов, списывается отсюда само. Тратить все очки не обязательно."""
recap = "Всё, что отмечено крестиком, ещё требует внимания: нажмите на пункт, и вы попадёте на нужный шаг. Можно закончить и с открытыми пунктами, а поправить их потом на листе."

