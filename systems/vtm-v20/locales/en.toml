[help]
"profile.name" = "The name you go by now. It can be a mortal name, a nickname, or an alias."
"profile.player" = "Your own name, so the table knows who plays whom."
"profile.chronicle" = "The name of the game or campaign you play this character in."
"profile.freebies" = "How many freebie points the Storyteller allows. Usually 15; more for stronger characters, fewer for weaker."
"profile.concept" = "One line that sums them up: who they were and who they are now. E.g. “disgraced detective”."
"profile.nature" = "Your true self: what actually drives you and how you regain Willpower. Pick one or write your own."
"profile.demeanor" = "The mask you show others. It can differ a lot from your Nature."
"profile.clan" = "Your vampire lineage. It sets your three in-clan disciplines and a clan weakness."
"profile.generation" = "How distant you are from Caine. Lower is more powerful. 13th is the default for new characters; it sets your blood pool."
"profile.sire" = "The vampire who made you. Can be left blank for now."
"weakness" = "The curse every member of your clan carries. See the rulebook for your clan."

[guide]
concept = """
This step records the basics. Only the name and the concept are required.

Name: what the hero is called now, which can be a mortal name, a nickname or an alias. Concept: one line about who the person was before the Embrace and who they became, for example "Marta Kowalska, a night-shift nurse".

Nature is who the hero really is, Demeanor is how they want to look. Pick a value from the list or write your own. A gentle Demeanor over a cruel Nature usually makes an interesting hero.

In the "Freebie points" field enter how many points the Storyteller allows. It is usually 15, and that number is already filled in. Everything else can be changed later on the sheet.
"""
clan = """
Pick a clan from the list. Under each name you see what it is known for. The clan sets three clan disciplines, which are usually taken first, and a clan weakness, the curse of all its members. If you are not sure, read the descriptions in the list and pick the clan that fits your concept.

Generation sets your blood pool. It starts at 13, so leave it unless the Storyteller says otherwise. The lower the number, the bigger the blood pool. You can leave the Sire field empty.

Caitiff have no clan and may take any discipline.
"""
attributes = """
Attributes are the hero's inborn traits. There are nine, three in each group: Physical (Strength, Dexterity, Stamina), Social (Charisma, Manipulation, Appearance) and Mental (Perception, Intelligence, Wits). Each attribute already starts at 1.

Decide which group is the main one. Give the main group 7 extra points, the second 5, the third 3. Just put points on the attributes: the counter works out which group is which and shows how many points are left.

1 is poor, 3 is good, 5 is the limit of human ability. If you spend more, the excess is charged to your freebie points on the last step.
"""
abilities = """
Abilities are what the hero has learned. There are three groups: Talents, Skills and Knowledges. Every ability starts at 0.

As with attributes, pick a main group. Give it 13 points, the second 9, the third 5. The counter works out the order from where you put more.

On this step you can put no more than 3 points in one ability. To go higher you must spend freebie points. Follow your concept: a nurse will want Empathy and Medicine.
"""
disciplines = """
Disciplines are the vampire's supernatural powers. You have 3 points. Usually they go into the clan disciplines, which the list shows first. You can put one point in each of the three or all three in one.

The first dot gives a basic power, the fifth real mastery. Caitiff may pick any discipline. If you spend more than three points, the excess is charged to your freebie points.
"""
backgrounds = """
Backgrounds are what the hero has in the world besides skills: allies, money, contacts, a mentor, a haven. You have 5 points. Add a background from the list and give it dots.

Take what supports the concept: a fixer needs Contacts, an aristocrat needs Resources and Status.
"""
virtues = """
Virtues are the hero's moral compass. There are three: Conscience, Self-Control and Courage. Each already starts at 1, add 7 more points.

Conscience and Self-Control together give Humanity, Courage gives Willpower. High Humanity helps hold the Beast back, high Willpower helps you hold on when things get hard.
"""
freebies = """
On this step you can buy anything extra with freebie points. You entered the number on the first step, usually 15. Cost per dot: attribute 5, ability 2, discipline 7, background 1, virtue 2, Willpower 1, Humanity 2.

Anything you put over the budgets of earlier steps is charged here automatically, so you do not need to count by hand. You do not have to spend all the points. If the counter turns red you have spent more than you have: go back and remove the excess.
"""
recap = "Go through the list. An item with a cross still needs attention: tap it to return to that step. You can finish with open items and fix them later on the sheet."

