abilities = "Spend points on abilities: 13, 9 and 5 across the three groups. No more than 3 in one ability."
disciplines = "Spend 3 points on disciplines. Usually they go into the three clan disciplines."
backgrounds = "Spend 5 points on backgrounds: allies, money, contacts."
virtues = "Add 7 points to the virtues. Each already starts at 1."
freebies = "Buy anything extra here with freebie points. You do not have to spend them all."
recap = "Go through the list and return to any item with a cross if something is missing."

