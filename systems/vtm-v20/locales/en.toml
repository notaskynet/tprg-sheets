[help]
"profile.name" = "The name you go by now. It can be a mortal name, a nickname, or an alias."
"profile.player" = "Your own name, so the table knows who plays whom."
"profile.chronicle" = "The name of the game or campaign you play this character in."
"profile.freebies" = "How many freebie points the Storyteller allows. Usually 15; more for stronger characters, fewer for weaker."
"profile.concept" = "One line that sums them up: who they were and who they are now. E.g. “disgraced detective”."
"profile.nature" = "Your true self: what actually drives you and how you regain Willpower. Pick one or write your own."
"profile.demeanor" = "The mask you show others. It can differ a lot from your Nature."
"profile.clan" = "Your vampire lineage. It sets your three in-clan disciplines and a clan weakness."
"profile.generation" = "How distant you are from Caine. Lower is more powerful. 13th is the default for new characters; it sets your blood pool."
"profile.sire" = "The vampire who made you. Can be left blank for now."
"weakness" = "The curse every member of your clan carries. See the rulebook for your clan."

[guide]
concept = """
A name and one line about who this is will do to start, for example "Marta Kowalska, night-shift nurse". Think about who they were before the Embrace and what they want now.

Nature is who they really are, Demeanor is who they pretend to be. A gentle Demeanor over a cruel Nature often makes an interesting character. You can change all of this later."""
clan = """
Your clan sets three clan disciplines and a weakness every member shares. Read the descriptions and pick the one that fits your concept.

New characters are usually Generation 13 unless the Storyteller says otherwise. The lower the number, the bigger the blood pool. Caitiff have no clan and may take any discipline."""
attributes = """
Attributes are what you were born with, and each starts at 1. Pick your main group and it gets 7 points, the second gets 5, the third gets 3.

Physical: Strength, Dexterity, Stamina. Social: Charisma, Manipulation, Appearance. Mental: Perception, Intelligence, Wits. A 1 is poor, 3 is good, 5 is the peak of human ability."""
abilities = """
Abilities are what the character has learned, and they start at 0. Set priorities again: 13 points for the main group, 9 for the next, 5 for the last (Talents, Skills, Knowledges).

On this step no ability goes above 3; going higher costs freebie points. Follow the concept: a nurse will want Empathy and Medicine."""
disciplines = """
Disciplines are supernatural powers. You have 3 points, usually spent on clan disciplines (quick pick lists them first).

You can take one point in three disciplines or all three in one. The first dot is a taste of the power, the fifth is mastery."""
backgrounds = """
Backgrounds are what the character has in the world besides skills: allies, money, contacts, a mentor, a haven. You get 5 points.

Take what supports the concept: a fixer needs Contacts, an aristocrat needs Resources and Status."""
virtues = """
Virtues are the moral compass. Add 7 points to the starting 1 in each.

Conscience and Self-Control together give Humanity, Courage gives Willpower. High Humanity helps hold the Beast back, high Willpower helps you keep going when things get hard."""
freebies = """
Here are your freebie points for fine tuning, the number you set on the first step (usually 15). Cost per dot: attribute 5, ability 2, discipline 7, background 1, virtue 2, Willpower 1, Humanity 2.

Anything you put over the budgets of earlier steps is charged here automatically. You don't have to spend them all."""
recap = "Anything marked with a cross still needs attention: tap it to jump to that step. You can finish with open items and fix them later on the sheet."

