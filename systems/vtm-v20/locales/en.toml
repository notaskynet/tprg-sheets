clan = "Your clan gives three disciplines and a weakness. Generation sets your blood pool."
attributes = "7, 5 and 3 points across the three groups: Physical, Social, Mental. Every attribute starts at 1."
abilities = "13, 9 and 5 points across Talents, Skills and Knowledges. No more than 3 in one ability."
disciplines = "3 points, usually in clan disciplines. Caitiff may pick any."
backgrounds = "5 points: contacts, resources, influence."
virtues = "7 points on top of the starting 1. They set Humanity and Willpower."
freebies = "Freebie points (the number is set on the first step, usually 15). Cost per dot: attribute 5, ability 2, discipline 7, background 1, virtue 2, Willpower 1, Humanity 2."
