# Vampire: The Masquerade — 20th Anniversary Edition
# Labels live in locales/*.toml: <group|catalog>.<id>, <group>.title, <group>.cat.<cat>, fields.<path>.

[groups.attributes]
categories = ["physical", "social", "mental"]
field = { type = "dots", min = 1, max = 5 }
