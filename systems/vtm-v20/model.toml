[fields]
"profile.name" = { type = "text" }
"profile.player" = { type = "text" }
"profile.chronicle" = { type = "text" }
"profile.concept" = { type = "text" }
"profile.nature" = { type = "text", suggest = "archetypes" }
"profile.demeanor" = { type = "text", suggest = "archetypes" }
"profile.clan" = { type = "select", from = "clans" }
"profile.generation" = { type = "number", default = 13 }
"profile.sire" = { type = "text" }
weakness = { type = "text" }
disciplines = { type = "list", item = "dots", suggest = "disciplines", max = 5 }
backgrounds = { type = "list", item = "dots", suggest = "backgrounds", max = 5 }
merits = { type = "list", item = "note" }
flaws = { type = "list", item = "note" }
humanityBonus = { type = "number", min = -10, max = 10, default = 0 }
willpowerBonus = { type = "number", min = -10, max = 10, default = 0 }
willpowerCurrent = { type = "pool", max = "willpower", default = 1 }
blood = { type = "pool", max = "bloodMax", default = 0 }
health = { type = "damage-track", levels = ["bruised", "hurt", "injured", "wounded", "mauled", "crippled", "incapacitated"] }
"experience.total" = { type = "number", min = 0, default = 0 }
"experience.spent" = { type = "number", min = 0, default = 0 }
notes = { type = "longtext" }

[derived]
humanityBase = "virtues.conscience + virtues.selfControl"
willpowerBase = "virtues.courage"
humanity = "humanityBase + humanityBonus"
willpower = "willpowerBase + willpowerBonus"
bloodMax = "table('bloodPool', profile.generation)[0]"
bloodPerTurn = "table('bloodPool', profile.generation)[1]"
damage = "sum(health)"
healthPenalty = "table('healthPenalty', damage)"
incapacitated = "damage >= 7"

# Dice-pool penalty by total damage. Incapacitation (damage >= 7) is the `incapacitated` derived value.
[tables.healthPenalty]
0 = 0
1 = 0
2 = -1
3 = -1
4 = -2
5 = -2
6 = -5
7 = -5

# generation -> [max blood pool, blood per turn]
[tables.bloodPool]
4 = [50, 10]
5 = [40, 8]
6 = [30, 6]
7 = [20, 4]
8 = [15, 3]
9 = [14, 2]
10 = [13, 1]
11 = [12, 1]
12 = [11, 1]
13 = [10, 1]
