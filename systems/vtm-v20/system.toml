#:schema ../../schema/system.schema.json
id = "vtm-v20"
version = "1.0.0"
languages = ["ru", "en"]
family = { en = "World of Darkness", ru = "Мир Тьмы" }
tags = ["horror", "d10", "vampire"]
accent = "#a01e2e"
name = { ru = "Маскарад V20", en = "Masquerade V20" }
description = { en = "Gothic-punk horror: play a vampire in the World of Darkness. Clans, disciplines and freebie points; d10 dice pools.", ru = "Готический хоррор: вы играете вампиром в Мире Тьмы. Кланы, дисциплины, свободные очки; пулы d10." }

[summary]
title = "profile.name"
subtitle = ["profile.clan", "profile.concept"]
stats = ["humanity", "willpower", "blood"]

# d10 pool vs difficulty; 1s cancel successes; botch on 1s with no successes;
# a specialty adds one die.
[dice]
mechanic = "pool-successes"
die = 10
defaultDifficulty = 6
onesCancel = true
specialty = "extra-die"
