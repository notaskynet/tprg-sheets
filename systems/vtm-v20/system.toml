id = "vtm-v20"
version = "1.0.0"
languages = ["ru", "en"]
name = { ru = "Маскарад V20", en = "Masquerade V20" }

# d10 pool vs difficulty; 1s cancel successes; botch on 1s with no successes;
# a specialty adds one die.
[dice]
mechanic = "pool-successes"
die = 10
defaultDifficulty = 6
onesCancel = true
specialty = "extra-die"
