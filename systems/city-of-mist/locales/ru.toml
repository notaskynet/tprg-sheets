[desc.moves]
investigate = "Ищешь ответы или скрытое. При попадании получаешь Улики по числу Силы: каждая даёт один вопрос с прямым ответом или зацепкой. При 7–9 Мастер добавляет осложнение: опасность, туман в ответах или встречный вопрос."
persuade = "Влияешь на кого-то словами, угрозой или соблазном. При попадании назови статус уровня, равного Силе. Цель принимает его или уступает: при 7–9 с оговорками, при 10+ полностью."
face_danger = "Тебе грозит статус, который назвал Мастер. При 10+ ты его избегаешь, при 7–9 принимаешь с уровнем на 1 ниже, при промахе он ложится как есть."
go_all_out = "Удобный момент, чтобы выложиться целиком. При попадании цель получает продолжительный статус уровня Силы. При 7–9 выбери одно, при 10+ два: надёжная позиция, +1 к уровню или вторая цель, ты решаешь про побочный урон, цель следит только за тобой, Заряд."
throw_down = "Открытое столкновение, где цель сопротивляется. При 7–9 выбери одно, при 10+ два: цель или преимущество, статус уровня Силы на противнике, защита от ответа. Что не выбрано, ложится на тебя."
change_game = "Самый гибкий приём: помочь себе и союзникам, ослабить врага, создать предмет. При попадании получаешь Заряды по числу Силы (минимум 1). Заряд создаёт тег истории, сжигает тег или меняет уровень статуса на 1. При 10+ дают минимум 2 Заряда и можно усилить, продлить или скрыть эффект."
act_covertly = "Ложь, скрытность, карманная кража. При 10+ цели поддаются. При 7–9 Мастер выбирает осложнение: тебя заметил посторонний, цель чует неладное или приходится оставить след."
take_risk = "Дерзкий, опасный или глупый поступок без прямого противника. При 10+ всё удаётся. При 7–9 Мастер предлагает два-три неприятных варианта: статус, сожжённый тег или потеря."

