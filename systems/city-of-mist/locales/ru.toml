[hints]
concept = "Запишите имя героя и одну фразу о нём."
theme1 = "Заполните тип темы, название, вопрос, три тега силы и тег слабости."
theme2 = "Заполните тип темы, название, вопрос, три тега силы и тег слабости."
theme3 = "Заполните тип темы, название, вопрос, три тега силы и тег слабости."
theme4 = "Заполните тип темы, название, вопрос, три тега силы и тег слабости."
recap = "Проверьте, что все четыре темы заполнены."

[guide]
concept = "Здесь нужно записать, кто ваш герой в обычной жизни. Заполните пять полей.\n\n- Имя героя.\n- Игрок: ваше имя, чтобы лист не терялся за столом.\n- Мифос: одна фраза о сверхъестественной стороне героя, например «чудовище, живущее в боксёре».\n- Логос: одна фраза о его обычной жизни, например «боксёр, задолжавший не тем людям».\n\nПро сверхъестественные силы пока думать не нужно. Их вы опишете на следующих шагах, в темах."
theme1 = "На этом и следующих трёх шагах вы описываете четыре темы героя. Тема это одна важная сторона героя: его способность, прошлое, работа или отношения. Поля у всех тем одинаковые.\n\nСначала выберите тип темы. Тема Мифа описывает легенду внутри героя и его сверхъестественные силы. Тема Личности описывает обычную жизнь: профессию, близких, убеждения. Чтобы герой был живым, обычно берут хотя бы одну тему каждого типа. Одна тема Мифа и три Личности делают героя «бликом», две и две «эквилибром», три и одна «легендарием».\n\nЗатем заполните поля по порядку.\n\n- Темник: подсказка, из чего собрать тему. Выберите из списка или впишите своё. Это поле можно пропустить.\n- Название темы: короткий ярлык, например «чёрный антиквар» или «лисий дух».\n- Тайна или Ориентир. Для темы Мифа это Тайна, вопрос о своей легенде, на который герой хочет найти ответ, например «Кто дал мне эту силу?». Для темы Личности это Ориентир, убеждение, которое определяет героя, например «Семья важнее денег».\n- Три тега силы: короткие описания того, что выручает героя в этой теме. Это может быть черта, умение, предмет или союзник, например «меткий стрелок». Когда тег прямо помогает действию, он даёт +1 к Силе. Сила это число, которое вы прибавляете к броску двух кубиков.\n- Один тег слабости: то, что героя подводит, например «не выносит толпы». Он даёт −1 к Силе, но за него вы отмечаете Укрепление темы, а оно со временем открывает улучшения."
theme2 = "Эта тема заполняется так же, как первая: выберите тип, придумайте название, Тайну или Ориентир, три тега силы и один тег слабости. Старайтесь, чтобы темы описывали разные стороны героя, а не повторяли друг друга.\n\nЕсли забыли, что писать в поле, под ним есть короткая подсказка."
theme3 = "Эта тема заполняется так же, как первая: выберите тип, придумайте название, Тайну или Ориентир, три тега силы и один тег слабости. Старайтесь, чтобы темы описывали разные стороны героя, а не повторяли друг друга.\n\nЕсли забыли, что писать в поле, под ним есть короткая подсказка."
theme4 = "Эта тема заполняется так же, как первая: выберите тип, придумайте название, Тайну или Ориентир, три тега силы и один тег слабости. Старайтесь, чтобы темы описывали разные стороны героя, а не повторяли друг друга.\n\nЕсли забыли, что писать в поле, под ним есть короткая подсказка."
recap = "Проверьте список. В каждой из четырёх тем должны быть тип, название, Тайна или Ориентир, три тега силы и тег слабости. Если пункт отмечен крестиком, нажмите на него, и вы вернётесь на нужный шаг.\n\nВсё остальное заполняется во время игры: статусы, улики, заряды, теги истории и улучшения тем. Для них на листе есть свои поля."

