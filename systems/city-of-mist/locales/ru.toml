[hints]
concept = "Сначала человек, потом легенда."
theme1 = "Три тега силы, один тег слабости и вопрос темы."
theme2 = "Три тега силы, один тег слабости и вопрос темы."
theme3 = "Три тега силы, один тег слабости и вопрос темы."
theme4 = "Три тега силы, один тег слабости и вопрос темы."
recap = "Проверь, что в каждой теме всё заполнено."

[guide]
concept = "Героя в игре называют разломом: через него легенда проникает в Город. Начни с обычного человека. Чем он занимался, чего хочет, что боится потерять? Легенда в нём пока только искра, о ней вы расскажете в темах.\n\nКонцепция одной фразой помогает остальным за столом: «бывший боксёр, ставший чудовищем», «хакерша, увидевшая катастрофу»."
theme1 = "У героя четыре темы. Тема Мифа описывает легенду и чудеса, тема Личности обычную жизнь, знания и привязанности. Одна тема Мифа и три Личности делают героя бликом, две и две эквилибром, три и одна легендарием.\n\nДля каждой темы нужны название, три тега силы, хотя бы один тег слабости и вопрос. У Мифа это Тайна: что герой хочет узнать о своей легенде. У Личности это Ориентир: убеждение, которое определяет героя.\n\nТег силы может быть чертой, умением, предметом, союзником или любимой фразой. Он добавляет 1 к Силе, если прямо помогает действию. Тег слабости на 1 уменьшает Силу, но за него отмечается Укрепление темы."
theme2 = "Тема того же устройства: название, три тега силы, тег слабости и вопрос. Для Мифа это Тайна, для Личности Ориентир. Следи за балансом: если все четыре темы одного типа, герой уйдёт в крайность."
theme3 = "Тема того же устройства: название, три тега силы, тег слабости и вопрос. Для Мифа это Тайна, для Личности Ориентир. Следи за балансом: если все четыре темы одного типа, герой уйдёт в крайность."
theme4 = "Тема того же устройства: название, три тега силы, тег слабости и вопрос. Для Мифа это Тайна, для Личности Ориентир. Следи за балансом: если все четыре темы одного типа, герой уйдёт в крайность."
recap = "Проверь, что в каждой теме есть три тега силы, тег слабости и Тайна или Ориентир. Всё остальное заполняется в игре: статусы, улики, заряды, теги истории и улучшения тем."

