[desc.moves]
investigate = "Ты ищешь ответы или то, что скрыто. Брось 2d6 плюс Сила. При 7 и выше получаешь Улики по числу Силы. За каждую Улику можно задать один вопрос по теме расследования, и Мастер ответит прямо или даст зацепку. При 7–9 Мастер добавляет осложнение: ты попал в опасность, часть сведений неточная или тебе задают встречный вопрос."
persuade = "Ты убеждаешь, пугаешь или соблазняешь кого-то. Брось 2d6 плюс Сила. При 7 и выше назови статус с уровнем, равным Силе. Цель может принять этот статус или поступить по-твоему: при 7–9 она соглашается, но ставит свои условия, при 10+ соглашается полностью."
face_danger = "Ты пытаешься избежать вреда, когда Мастер назвал статус, который тебе грозит. Брось 2d6 плюс Сила. При 10+ статуса нет. При 7–9 ты получаешь его, но на 1 уровень ниже. При 6 и меньше статус ложится так, как был назван."
go_all_out = "У тебя есть удобный момент ударить изо всех сил: выстрелом, кулаком или силой мифоса. Брось 2d6 плюс Сила. При 7 и выше цель получает продолжительный статус с уровнем, равным Силе. Кроме того, при 7–9 выбери одно, при 10+ два: займи выгодную позицию, добавь +1 к уровню статуса или задень вторую цель, сам реши, какой будет побочный ущерб, удержи внимание цели на себе, получи Заряд."
throw_down = "Ты вступаешь в открытое противоборство, например в драку или состязание, и противник сопротивляется. Назови, чего хочешь добиться, и брось 2d6 плюс Сила. При 7–9 выбери одно, при 10+ два: добиться цели или получить преимущество, наложить на противника статус с уровнем Силы, защититься от его ответа. Что ты не выбрал, достанется тебе: противник сможет наложить на тебя статус."
change_game = "Ты помогаешь себе или союзникам, мешаешь врагу или создаёшь полезный предмет. Брось 2d6 плюс Сила. При 7 и выше получаешь Заряды по числу Силы, но не меньше 1. Каждый Заряд можно потратить, чтобы создать тег истории, сжечь тег или изменить уровень статуса на 1. При 10+ Зарядов будет минимум 2, и за один из них можно сделать эффект шире, дольше или скрытнее."
act_covertly = "Ты лжёшь, прячешься, воруешь или проникаешь куда-то незаметно. Брось 2d6 плюс Сила. При 10+ все цели обмануты. При 7–9 всё получается, но Мастер выбирает осложнение: тебя заметил посторонний, цель что-то заподозрила или тебе пришлось оставить след."
take_risk = "Ты делаешь что-то опасное, дерзкое или глупое, и тебе никто напрямую не противостоит. Брось 2d6 плюс Сила. При 10+ всё получается. При 7–9 Мастер предлагает выбрать из двух-трёх плохих последствий: получить статус, сжечь тег или чем-то пожертвовать."

