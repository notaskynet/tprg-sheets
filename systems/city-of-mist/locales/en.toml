[hints]
concept = "The person first, the legend second."
theme1 = "Three power tags, one weakness tag and the theme's question."
theme2 = "Three power tags, one weakness tag and the theme's question."
theme3 = "Three power tags, one weakness tag and the theme's question."
theme4 = "Three power tags, one weakness tag and the theme's question."
recap = "Check that every theme is filled in."

[guide]
concept = "The hero is called a Rift: a way for a legend to enter the City. Start with an ordinary person. What did they do, what do they want, what are they afraid to lose? The legend is only a spark so far, and the themes will tell its story.\n\nA concept in one line helps the table: \"a boxer turned monster\", \"a hacker who saw a disaster\"."
theme1 = "A hero has four themes. A Mythos theme describes the legend and its wonders, a Logos theme the ordinary life, knowledge and attachments. One Mythos and three Logos make a Blip, two and two a Balance, three and one a Legend.\n\nEvery theme needs a name, three power tags, at least one weakness tag and a question. For Mythos it is the Mystery: what the hero wants to learn about their legend. For Logos it is the Identity: the belief that defines the hero.\n\nA power tag can be a trait, a skill, an item, an ally or a catchphrase. It adds 1 to Power when it directly helps the action. A weakness tag subtracts 1 from Power, but you mark Attention on its theme."
theme2 = "Same shape: a name, three power tags, a weakness tag and a question. Mystery for Mythos, Identity for Logos. Watch the balance: four themes of one kind push the hero to an extreme."
theme3 = "Same shape: a name, three power tags, a weakness tag and a question. Mystery for Mythos, Identity for Logos. Watch the balance: four themes of one kind push the hero to an extreme."
theme4 = "Same shape: a name, three power tags, a weakness tag and a question. Mystery for Mythos, Identity for Logos. Watch the balance: four themes of one kind push the hero to an extreme."
recap = "Check that every theme has three power tags, a weakness tag and a Mystery or Identity. The rest is filled in during play: statuses, clues, juice, story tags and theme improvements."

