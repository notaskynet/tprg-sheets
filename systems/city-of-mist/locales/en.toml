[desc.themebooks]
adaptation = "A power that changed the hero's body or nature."
bastion = "Protection and endurance: shelter, armour, an unbending will."
manifestation = "The mythos shows itself in the world: an element, a creature, a special shape."
mystification = "Deception, illusion and secrecy as the power of the legend."
mobility = "Speed and movement: being where you need to be."
divination = "Visions and instinct: learning what cannot be seen."
relic = "An object the legend lives in."
routine = "Everyday activities, work and daily skills."
defining_event = "What happened and made the hero who they are."
possessions = "Belongings, money, transport, everything the hero owns."
identity = "Beliefs and how the hero sees themselves."
mission = "A goal, a promise or a duty the hero lives for."
relationships = "The people the hero cannot turn away from."
training = "Schooling, craft and professional skills."

[moves]
investigate = "Investigate"
persuade = "Convince"
face_danger = "Face danger"
go_all_out = "Hit with all you've got"
throw_down = "Go toe to toe"
change_game = "Change the game"
act_covertly = "Sneak around"
take_risk = "Take the risk"

[desc.moves]
investigate = "You look for answers or something hidden. On a hit you get Clues equal to Power: each buys one question, answered directly or with a lead. On 7–9 the MC adds a complication: danger, murky answers or a question back."
persuade = "You sway someone with words, threats or temptation. On a hit name a status at a level equal to Power. The target takes it or gives in: on 7–9 with conditions, on 10+ fully."
face_danger = "A status the MC named threatens you. On 10+ you avoid it, on 7–9 you take it one level lower, on a miss it lands as named."
go_all_out = "A good opening to give everything. On a hit the target gets a lasting status at a level equal to Power. On 7–9 choose one, on 10+ two: a safe position, +1 level or a second target, you decide the collateral, the target focuses on you, a Juice."
throw_down = "An open clash where the target resists. On 7–9 choose one, on 10+ two: your goal or an advantage, a status at Power level on the opponent, protection from the counter. What you skip lands on you."
change_game = "The most flexible move: help yourself or allies, weaken a foe, produce an item. On a hit you get Juice equal to Power (at least 1). Juice creates a story tag, burns a tag or shifts a status by 1. On 10+ you get at least 2 and can enhance, prolong or hide the effect."
act_covertly = "Lies, stealth, pickpocketing. On 10+ the targets are fooled. On 7–9 the MC picks a complication: a bystander notices, the target senses something, or you must leave a trace."
take_risk = "A bold, dangerous or foolish act with no direct opponent. On 10+ it works. On 7–9 the MC offers two or three bad options: a status, a burned tag or a loss."

