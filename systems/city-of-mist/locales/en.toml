[desc.themebooks]
adaptation = "A power that changed the hero's body or nature."
bastion = "Protection and endurance: shelter, armour, an unbending will."
manifestation = "The mythos shows itself in the world: an element, a creature, a special shape."
mystification = "Deception, illusion and secrecy as the power of the legend."
mobility = "Speed and movement: being where you need to be."
divination = "Visions and instinct: learning what cannot be seen."
relic = "An object the legend lives in."
routine = "Everyday activities, work and daily skills."
defining_event = "What happened and made the hero who they are."
possessions = "Belongings, money, transport, everything the hero owns."
identity = "Beliefs and how the hero sees themselves."
mission = "A goal, a promise or a duty the hero lives for."
relationships = "The people the hero cannot turn away from."
training = "Schooling, craft and professional skills."

[moves]
investigate = "Investigate"
persuade = "Convince"
face_danger = "Face danger"
go_all_out = "Hit with all you've got"
throw_down = "Go toe to toe"
change_game = "Change the game"
act_covertly = "Sneak around"
take_risk = "Take the risk"

[desc.moves]
investigate = "You look for answers or for something hidden. Roll 2d6 plus Power. On 7 or more you get Clues equal to Power. Each Clue lets you ask one question about what you are investigating, and the MC answers directly or gives a lead. On 7–9 the MC adds a complication: you are in danger, part of the information is unreliable, or you get asked a question back."
persuade = "You convince, scare or tempt someone. Roll 2d6 plus Power. On 7 or more name a status with a level equal to Power. The target can accept that status or do what you want: on 7–9 they agree but set conditions, on 10+ they agree fully."
face_danger = "You try to avoid harm when the MC has named a status that threatens you. Roll 2d6 plus Power. On 10+ you avoid the status. On 7–9 you get it, but one level lower. On 6 or less it lands as named."
go_all_out = "You have a good opening to hit with everything you have: a shot, a punch or the power of your mythos. Roll 2d6 plus Power. On 7 or more the target gets a lasting status with a level equal to Power. In addition, on 7–9 choose one, on 10+ choose two: take a safe position, add +1 to the status level or hit a second target, decide the collateral damage yourself, keep the target's attention on you, gain a Juice."
throw_down = "You enter an open clash, such as a fight or a contest, and the opponent resists. Say what you want to achieve and roll 2d6 plus Power. On 7–9 choose one, on 10+ choose two: reach your goal or gain an advantage, put a status at Power level on the opponent, protect yourself from their counter. What you do not choose falls on you: the opponent can put a status on you."
change_game = "You help yourself or allies, hinder an enemy or produce a useful item. Roll 2d6 plus Power. On 7 or more you get Juice equal to Power, but at least 1. Each Juice can be spent to create a story tag, burn a tag or shift a status by 1 level. On 10+ you get at least 2 Juice, and one of them can make the effect wider, longer lasting or hidden."
act_covertly = "You lie, hide, steal or slip somewhere unseen. Roll 2d6 plus Power. On 10+ every target is fooled. On 7–9 it works, but the MC picks a complication: a bystander notices you, the target suspects something, or you have to leave a trace."
take_risk = "You do something dangerous, bold or foolish and nobody directly opposes you. Roll 2d6 plus Power. On 10+ it works. On 7–9 the MC offers a choice of two or three bad outcomes: take a status, burn a tag or sacrifice something."

[steps]
concept = "Hero"
theme1 = "Theme 1"
theme2 = "Theme 2"
theme3 = "Theme 3"
theme4 = "Theme 4"
recap = "Summary"

[hints]
concept = "Write the hero's name and one line about them."
theme1 = "Fill in the theme type, name, question, three power tags and a weakness tag."
theme2 = "Fill in the theme type, name, question, three power tags and a weakness tag."
theme3 = "Fill in the theme type, name, question, three power tags and a weakness tag."
theme4 = "Fill in the theme type, name, question, three power tags and a weakness tag."
recap = "Check that all four themes are filled in."

[guide]
concept = "Here you write down who your hero is in ordinary life. Fill in five fields.\n\n- The hero's name.\n- Player: your name, so the sheet does not get lost at the table.\n- Mythos: one short line about the hero's supernatural side, for example \"a monster living inside a boxer\".\n- Logos: one short line about their ordinary life, for example \"a boxer who owes money to the wrong people\".\n\nYou do not need to think about supernatural powers yet. You will describe them in the themes on the next steps."
theme1 = "On this step and the next three you describe the hero's four themes. A theme is one important side of the hero: an ability, a past, a job or a relationship. Every theme has the same fields.\n\nFirst pick the theme type. A Mythos theme describes the legend inside the hero and their supernatural powers. A Logos theme describes ordinary life: a profession, loved ones, beliefs. To keep a hero alive and human, most players take at least one theme of each type. One Mythos and three Logos make a \"Blip\", two and two a \"Balance\", three and one a \"Legend\".\n\nThen fill in the fields in order.\n\n- Themebook: a hint about what to build the theme from. Pick one or write your own. You can skip this field.\n- Theme name: a short label, for example \"black-market antiquarian\" or \"fox spirit\".\n- Mystery or Identity. For a Mythos theme this is the Mystery, a question about your legend that the hero wants answered, for example \"Who gave me this power?\". For a Logos theme it is the Identity, a belief that defines the hero, for example \"Family comes before money\".\n- Three power tags: short descriptions of what helps the hero in this theme. It can be a trait, a skill, an item or an ally, for example \"sharpshooter\". When a tag directly helps an action it gives +1 to Power. Power is the number you add to the roll of two dice.\n- One weakness tag: what lets the hero down, for example \"cannot stand crowds\". It gives -1 to Power, but you mark Attention on the theme for it, and Attention eventually unlocks improvements."
theme2 = "Fill in this theme the same way as the first: pick a type, name it, write a Mystery or Identity, three power tags and one weakness tag. Try to make the themes describe different sides of the hero instead of repeating each other.\n\nIf you forget what a field is for, there is a short hint under it."
theme3 = "Fill in this theme the same way as the first: pick a type, name it, write a Mystery or Identity, three power tags and one weakness tag. Try to make the themes describe different sides of the hero instead of repeating each other.\n\nIf you forget what a field is for, there is a short hint under it."
theme4 = "Fill in this theme the same way as the first: pick a type, name it, write a Mystery or Identity, three power tags and one weakness tag. Try to make the themes describe different sides of the hero instead of repeating each other.\n\nIf you forget what a field is for, there is a short hint under it."
recap = "Check the list. Each of the four themes needs a type, a name, a Mystery or Identity, three power tags and a weakness tag. If an item is marked with a cross, tap it to go back to that step.\n\nEverything else is filled in during play: statuses, clues, juice, story tags and theme improvements. The sheet has fields for them."

