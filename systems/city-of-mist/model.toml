# theme 4
"t4.kind" = { type = "select", from = "themeKinds" }
"t4.book" = { type = "text", suggest = "themebooks" }
"t4.name" = { type = "text" }
"t4.question" = { type = "text" }
"t4.power1" = { type = "text" }
"t4.burn1" = { type = "checkbox" }
"t4.power2" = { type = "text" }
"t4.burn2" = { type = "checkbox" }
"t4.power3" = { type = "text" }
"t4.burn3" = { type = "checkbox" }
"t4.power4" = { type = "text" }
"t4.burn4" = { type = "checkbox" }
"t4.power5" = { type = "text" }
"t4.burn5" = { type = "checkbox" }
"t4.weak1" = { type = "text" }
"t4.weak2" = { type = "text" }
"t4.weak3" = { type = "text" }
"t4.attention" = { type = "checkboxes", count = 3 }
"t4.drain" = { type = "checkboxes", count = 3 }
