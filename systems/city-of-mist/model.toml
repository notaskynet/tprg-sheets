[derived]
mythosCount = "if(t1.kind == 'mythos', 1, 0) + if(t2.kind == 'mythos', 1, 0) + if(t3.kind == 'mythos', 1, 0) + if(t4.kind == 'mythos', 1, 0)"
logosCount = "if(t1.kind == 'logos', 1, 0) + if(t2.kind == 'logos', 1, 0) + if(t3.kind == 'logos', 1, 0) + if(t4.kind == 'logos', 1, 0)"
# the best helpful status adds, the worst harmful one subtracts
status_mod = "top(statuses.pos) - top(statuses.neg)"
