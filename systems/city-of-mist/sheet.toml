#:schema ../../schema/sheet.schema.json
# Tags and statuses are not numbers on the sheet: open the roll dialog, switch the tags that help
# (+1) or hurt (-1), and the statuses add their best/worst level. The dialog does the arithmetic.
[roll]
penalty = "status_mod"
penaltyLabel = "labels.statusMod"

[[roll.toggles]]
text = "t1.power1"
burned = "t1.burn1"
sign = 1

