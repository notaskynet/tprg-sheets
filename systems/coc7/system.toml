#:schema ../../schema/system.schema.json
id = "coc7"
version = "1.0.0"
languages = ["en", "ru"]
name = { en = "Call of Cthulhu 7e", ru = "Зов Ктулху 7e" }
description = { en = "Cosmic-horror investigation. Percentile skills, Sanity and Luck; roll d100 at or under your skill.", ru = "Расследования космического хоррора. Процентные навыки, Рассудок и Удача; бросок d100 не выше навыка." }
accent = "#3f8f86"
family = { en = "Cthulhu Mythos", ru = "Мифы Ктулху" }
tags = ["horror", "d100", "investigation"]
credits = "Fan-made sheet implementing the percentile mechanics of Call of Cthulhu 7th Edition. Not affiliated with or endorsed by Chaosium Inc."

[summary]
campaign = "profile.campaign"
title = "profile.name"
subtitle = ["profile.occupation"]
stats = ["hp_max", "san_max", "luck"]

# Roll d100 at or under the skill: regular, hard (1/2) and extreme (1/5) successes;
# bonus and penalty dice.
[dice]
mechanic = "d100-under"
