[guide]
concept = """
Запишите имя сыщика и его профессию. Эти два поля обязательны. Возраст и место жительства можно заполнить позже.

Выберите правдоподобную профессию: библиотекарь, журналист, врач. Она подскажет, куда вкладывать очки навыков. Возраст по правилам книги влияет на характеристики, но лист поправки сам не применяет. Если играете пожилым сыщиком, поменяйте значения вручную.
"""
characteristics = """
Здесь вы бросаете кубики на характеристики. Нажмите «Бросить все», и значения появятся сразу. Если какое-то не понравилось, кнопка ↻ рядом с ним перебросит только его.

Сила, Телосложение, Ловкость, Внешность, Мощь и Удача определяются как 3d6×5. Размер, Интеллект и Образование как (2d6+6)×5. Здоровье, очки магии и Рассудок вычисляются сами, считать их не нужно. Спросите мастера, разрешены ли переброски.
"""
skills = """
Теперь распределите очки навыков. Их столько, сколько даёт формула: Образование×4 плюс Интеллект×2. Счётчик сверху показывает, сколько вы уже потратили.

Вкладывайте очки в то, что подсказывают профессия и интересы. Число, которое вы вводите, это добавленные очки, а итоговое значение (база плюс добавленное) стоит рядом. При создании не поднимайте навык выше 75. Навык «Мифы Ктулху» оставьте на 0. База Уклонения и Родного языка берётся из Ловкости и Образования сама.
"""
recap = "Пройдите по списку. Пункт с крестиком можно исправить: нажмите на него, и вы вернётесь на нужный шаг."

