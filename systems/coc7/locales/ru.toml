[hints]
concept = "Кто ваш сыщик? Имя и профессия."
characteristics = "Бросьте характеристики: 3d6×5, а Размер, Интеллект и Образование (2d6+6)×5."
skills = "Распределите очки навыков: Образование×4 плюс Интеллект×2."
recap = "Проверьте итоги."

[guide]
characteristics = """
**Roll once per characteristic.** The ↻ button rerolls a single one.

- STR, CON, DEX, APP, POW and Luck: **3d6 × 5**.
- SIZ, INT, EDU: **(2d6 + 6) × 5**.
- Hit points, magic points and Sanity are worked out for you."""
skills = """
**Skill points = EDU × 4 + INT × 2.** Add points to the skills your occupation and interests suggest.

- The number shows **added** points; the total (base + added) appears next to it.
- Keep a skill at **75 or less** during creation. Cthulhu Mythos stays at 0.
- Dodge and Language (Own) get their base from DEX and EDU automatically."""

concept = """
**Кто ваш сыщик?** Выберите правдоподобную профессию: она подскажет, куда вкладывать очки навыков.

Пожилые сыщики мудрее, но слабее; не забудьте применить возрастные поправки вручную."""
recap = """
**Проверьте итоги.** Нажмите на пункт с крестиком, чтобы перейти к его шагу."""

[help]
"profile.name" = "Имя вашего сыщика."
"profile.player" = "Ваше собственное имя, чтобы за столом было ясно, кто кого играет."
"profile.occupation" = "Чем сыщик зарабатывает: библиотекарь, журналист, врач… Подсказывает, какие навыки развивать."
"profile.age" = "15–90. Возрастные поправки к характеристикам не применяются автоматически."
