[hints]
concept = "Кто ваш сыщик? Имя и профессия."
characteristics = "Бросьте характеристики: 3d6×5, а для Размера, Интеллекта и Образования (2d6+6)×5."
skills = "Очки навыков: Образование×4 плюс Интеллект×2."
recap = "Проверьте итоги."

[guide]
concept = "Выберите правдоподобную профессию: она подскажет, куда вкладывать очки навыков. Пожилые сыщики мудрее, но слабее, так что возрастные поправки придётся применить вручную."
characteristics = "На каждую характеристику один бросок, кнопка ↻ перебрасывает только её. Сила, Телосложение, Ловкость, Внешность, Мощь и Удача: 3d6×5. Размер, Интеллект и Образование: (2d6+6)×5. Здоровье, очки магии и Рассудок считаются сами."
skills = """
Очков навыков столько, сколько даёт Образование×4 плюс Интеллект×2. Вкладывайте их в навыки, которые подсказывают профессия и интересы.

Число рядом с навыком показывает добавленные очки, а итог (база плюс добавленное) стоит рядом. При создании не поднимайте навык выше 75, Мифы Ктулху остаются 0. База Уклонения и Родного языка берётся из Ловкости и Образования сама."""
recap = "Всё, что отмечено крестиком, можно исправить: нажмите на пункт, и вы перейдёте к его шагу."

[help]
"profile.name" = "Имя вашего сыщика."
"profile.player" = "Ваше собственное имя, чтобы за столом было ясно, кто кого играет."
"profile.occupation" = "Чем сыщик зарабатывает: библиотекарь, журналист, врач… Подсказывает, какие навыки развивать."
"profile.age" = "15–90. Возрастные поправки к характеристикам не применяются автоматически."
