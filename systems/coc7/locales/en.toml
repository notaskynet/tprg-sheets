[hints]
concept = "Who is your investigator? A name and an occupation."
characteristics = "Roll the characteristics: 3d6×5, and (2d6+6)×5 for Size, Intelligence and Education."
skills = "Skill points: EDU×4 plus INT×2."
recap = "Check the summary."

[guide]
concept = "Pick a believable occupation: it suggests where to put your skill points. Older investigators are wiser but frailer, so you have to apply the age modifiers by hand."
characteristics = "Each characteristic is one roll, and the ↻ button rerolls just that one. STR, CON, DEX, APP, POW and Luck use 3d6×5. SIZ, INT and EDU use (2d6+6)×5. Hit points, magic points and Sanity are worked out for you."
skills = """
You get EDU×4 plus INT×2 skill points. Put them into the skills your occupation and interests suggest.

The number next to a skill is the points you added, and the total (base plus added) sits beside it. Keep a skill at 75 or less during creation; Cthulhu Mythos stays at 0. Dodge and Language (Own) get their base from DEX and EDU automatically."""
recap = "Anything marked with a cross can be fixed: tap it to jump to its step."

[help]
"profile.name" = "Your investigator's name."
"profile.player" = "Your own name, so the table knows who plays whom."
"profile.occupation" = "What they do for a living: librarian, journalist, doctor… It suggests which skills to raise."
"profile.age" = "15–90. Age modifiers to characteristics are not applied automatically."
