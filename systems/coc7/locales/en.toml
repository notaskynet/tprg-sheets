characteristics = "Roll the characteristics: 3d6×5, and (2d6+6)×5 for Size, Intelligence and Education."
skills = "Spend skill points: EDU×4 plus INT×2."
recap = "Check the summary."

[guide]
characteristics = """
**Один бросок на характеристику.** Кнопка ↻ перебрасывает только одну.

- STR, CON, DEX, APP, POW и Удача: **3d6 × 5**.
- SIZ, INT, EDU: **(2d6 + 6) × 5**.
- Здоровье, очки магии и Рассудок считаются автоматически."""
skills = """
**Очки навыков = EDU × 4 + INT × 2.** Добавляйте очки в навыки, которые подсказывают профессия и интересы.

- Число показывает **добавленные** очки; итог (база + добавленное) рядом.
- Держите навык не выше **75** при создании. Мифы Ктулху остаются 0.
- База Уклонения и Родного языка берётся из DEX и EDU автоматически."""
