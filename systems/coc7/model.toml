#:schema ../../schema/model.schema.json
# Call of Cthulhu 7e — percentile skills. A skill's stored value is the points you added;
# the total is base + added (see [derived]).

[groups.characteristics]
field = { type = "number", min = 0, max = 99, default = 0 }
items = [
  { id = "str" },
  { id = "con" },
  { id = "siz" },
  { id = "dex" },
  { id = "app" },
  { id = "int" },
  { id = "pow" },
  { id = "edu" },
  { id = "luck" },
]

[groups.skills]
categories = ["combat", "physical", "social", "mental", "technical"]
field = { type = "number", min = 0, max = 99, default = 0 }
items = [
  { id = "dodge", cat = "combat" },
  { id = "fighting_brawl", cat = "combat" },
  { id = "firearms_handgun", cat = "combat" },
  { id = "firearms_rifle", cat = "combat" },
  { id = "throw", cat = "combat" },
  { id = "climb", cat = "physical" },
  { id = "jump", cat = "physical" },
  { id = "swim", cat = "physical" },
  { id = "stealth", cat = "physical" },
  { id = "ride", cat = "physical" },
  { id = "drive_auto", cat = "physical" },
  { id = "pilot", cat = "physical" },
  { id = "op_hv_machine", cat = "physical" },
  { id = "charm", cat = "social" },
  { id = "fast_talk", cat = "social" },
  { id = "intimidate", cat = "social" },
  { id = "persuade", cat = "social" },
  { id = "psychology", cat = "social" },
  { id = "disguise", cat = "social" },
  { id = "sleight_of_hand", cat = "social" },
  { id = "accounting", cat = "mental" },
  { id = "anthropology", cat = "mental" },
  { id = "appraise", cat = "mental" },
  { id = "archaeology", cat = "mental" },
  { id = "history", cat = "mental" },
  { id = "language_own", cat = "mental" },
  { id = "language_other", cat = "mental" },
  { id = "law", cat = "mental" },
  { id = "library_use", cat = "mental" },
  { id = "medicine", cat = "mental" },
  { id = "natural_world", cat = "mental" },
  { id = "navigate", cat = "mental" },
  { id = "occult", cat = "mental" },
  { id = "science", cat = "mental" },
  { id = "psychoanalysis", cat = "mental" },
  { id = "cthulhu_mythos", cat = "mental" },
  { id = "art_craft", cat = "technical" },
  { id = "credit_rating", cat = "technical" },
  { id = "elec_repair", cat = "technical" },
  { id = "mech_repair", cat = "technical" },
  { id = "locksmith", cat = "technical" },
  { id = "first_aid", cat = "technical" },
  { id = "survival", cat = "technical" },
  { id = "track", cat = "technical" },
  { id = "listen", cat = "technical" },
  { id = "spot_hidden", cat = "technical" },
]

[fields]
"profile.name" = { type = "text" }
"profile.player" = { type = "text" }
"profile.occupation" = { type = "text" }
"profile.age" = { type = "number", min = 15, max = 90, default = 25 }
"profile.residence" = { type = "text" }
hp = { type = "pool", max = "hp_max", full = true }
mp = { type = "pool", max = "mp_max", full = true }
sanity = { type = "pool", max = "san_max", initial = "characteristics.pow" }
weapons = { type = "list", item = "note" }
possessions = { type = "list", item = "note" }
backstory = { type = "longtext" }
notes = { type = "longtext" }

[derived]
hp_max = "floor((characteristics.con + characteristics.siz) / 10)"
mp_max = "floor(characteristics.pow / 5)"
san_max = "99 - skills.cthulhu_mythos"
sb = "characteristics.str + characteristics.siz"
db = "if(sb < 65, '-2', if(sb < 85, '-1', if(sb < 125, '0', if(sb < 165, '+1D4', '+1D6'))))"
build = "if(sb < 65, -2, if(sb < 85, -1, if(sb < 125, 0, if(sb < 165, 1, 2))))"
move = "if(characteristics.dex < characteristics.siz and characteristics.str < characteristics.siz, 7, if(characteristics.dex > characteristics.siz and characteristics.str > characteristics.siz, 9, 8))"
luck = "characteristics.luck"
str_half = "floor(characteristics.str / 2)"
str_fifth = "floor(characteristics.str / 5)"
con_half = "floor(characteristics.con / 2)"
con_fifth = "floor(characteristics.con / 5)"
siz_half = "floor(characteristics.siz / 2)"
siz_fifth = "floor(characteristics.siz / 5)"
dex_half = "floor(characteristics.dex / 2)"
dex_fifth = "floor(characteristics.dex / 5)"
app_half = "floor(characteristics.app / 2)"
app_fifth = "floor(characteristics.app / 5)"
int_half = "floor(characteristics.int / 2)"
int_fifth = "floor(characteristics.int / 5)"
pow_half = "floor(characteristics.pow / 2)"
pow_fifth = "floor(characteristics.pow / 5)"
edu_half = "floor(characteristics.edu / 2)"
edu_fifth = "floor(characteristics.edu / 5)"
luck_half = "floor(characteristics.luck / 2)"
luck_fifth = "floor(characteristics.luck / 5)"
skill_dodge = "floor(characteristics.dex / 2) + skills.dodge"
skill_dodge_half = "floor(skill_dodge / 2)"
skill_dodge_fifth = "floor(skill_dodge / 5)"
skill_fighting_brawl = "25 + skills.fighting_brawl"
skill_fighting_brawl_half = "floor(skill_fighting_brawl / 2)"
skill_fighting_brawl_fifth = "floor(skill_fighting_brawl / 5)"
skill_firearms_handgun = "20 + skills.firearms_handgun"
skill_firearms_handgun_half = "floor(skill_firearms_handgun / 2)"
skill_firearms_handgun_fifth = "floor(skill_firearms_handgun / 5)"
skill_firearms_rifle = "25 + skills.firearms_rifle"
