#:schema ../../schema/model.schema.json
# D&D 5e (SRD 5.1) — mechanics only; see system.toml for the licence.

[groups.abilities]
field = { type = "number", min = 1, max = 30, default = 10 }
items = [
  { id = "str" },
  { id = "dex" },
  { id = "con" },
  { id = "int" },
  { id = "wis" },
  { id = "cha" },
]

[groups.saves]
field = { type = "checkbox" }
granted = "lookup('classes', profile.class, 'saves')"
items = [
  { id = "str" },
  { id = "dex" },
  { id = "con" },
  { id = "int" },
  { id = "wis" },
  { id = "cha" },
]

[groups.skills]
categories = ["str", "dex", "int", "wis", "cha"]
field = { type = "checkbox" }
granted = "concat(lookup('backgrounds', profile.background, 'skills'), lookup('races', profile.race, 'skills'), lookup('subraces', subrace, 'skills'))"
items = [
  { id = "acrobatics", cat = "dex" },
  { id = "animal_handling", cat = "wis" },
  { id = "arcana", cat = "int" },
  { id = "athletics", cat = "str" },
  { id = "deception", cat = "cha" },
  { id = "history", cat = "int" },
  { id = "insight", cat = "wis" },
  { id = "intimidation", cat = "cha" },
  { id = "investigation", cat = "int" },
  { id = "medicine", cat = "wis" },
  { id = "nature", cat = "int" },
  { id = "perception", cat = "wis" },
  { id = "performance", cat = "cha" },
  { id = "persuasion", cat = "cha" },
  { id = "religion", cat = "int" },
  { id = "sleight_of_hand", cat = "dex" },
  { id = "stealth", cat = "dex" },
  { id = "survival", cat = "wis" },
]

[catalogs.races]
items = [
  { id = "dwarf", con = 2, speed = 25, features = ["darkvision", "dwarven_resilience", "dwarven_combat_training", "dwarf_tool_proficiency", "stonecunning"], subraces = ["hill_dwarf"] },
  { id = "elf", dex = 2, speed = 30, skills = ["perception"], features = ["darkvision", "keen_senses", "fey_ancestry", "trance"], subraces = ["high_elf"] },
  { id = "halfling", dex = 2, speed = 25, features = ["lucky", "brave", "halfling_nimbleness"], subraces = ["lightfoot_halfling"] },
  { id = "human", str = 1, dex = 1, con = 1, int = 1, wis = 1, cha = 1, speed = 30, features = ["extra_language"] },
  { id = "dragonborn", str = 2, cha = 1, speed = 30, features = ["breath_weapon", "draconic_resistance"] },
  { id = "gnome", int = 2, speed = 25, features = ["darkvision", "gnome_cunning"], subraces = ["rock_gnome"] },
  { id = "half_elf", cha = 2, speed = 30, features = ["darkvision", "fey_ancestry", "skill_versatility"] },
  { id = "half_orc", str = 2, con = 1, speed = 30, skills = ["intimidation"], features = ["darkvision", "menacing", "relentless_endurance", "savage_attacks"] },
  { id = "tiefling", int = 1, cha = 2, speed = 30, features = ["darkvision", "hellish_resistance", "infernal_legacy"] },
  { id = "other", speed = 30, features = ["custom_race"] },
]

[catalogs.subraces]
items = [
  { id = "hill_dwarf", wis = 1, hpPerLevel = 1, features = ["dwarven_toughness"] },
  { id = "high_elf", int = 1, features = ["elf_weapon_training", "high_elf_cantrip", "extra_language"] },
  { id = "lightfoot_halfling", cha = 1, features = ["naturally_stealthy"] },
  { id = "rock_gnome", con = 1, features = ["artificers_lore", "tinker"] },
]

