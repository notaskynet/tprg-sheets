[fields]
"profile.name" = { type = "text" }
"profile.campaign" = { type = "text" }
"profile.player" = { type = "text" }
"profile.race" = { type = "select", from = "races" }
"profile.subrace" = { type = "select", from = "subraces", scope = "lookup('races', profile.race, 'subraces')" }
"profile.ancestry" = { type = "select", from = "ancestries" }
"profile.class" = { type = "select", from = "classes" }
"profile.subclassName" = { type = "text", when = "profile.subclass == 'other'" }
"profile.raceName" = { type = "text", when = "profile.race == 'other'" }
"profile.subclass" = { type = "select", from = "subclasses", scope = "lookup('classes', profile.class, 'subclasses')" }
"profile.background" = { type = "select", from = "backgrounds" }
"profile.alignment" = { type = "text", suggest = "alignments" }
level = { type = "number", min = 1, max = 20, default = 1 }
xp = { type = "number", min = 0, default = 0 }
ac = { type = "number", min = 0, default = 10 }
hpBonus = { type = "number", default = 0 }
hp = { type = "pool", max = "hpMax", full = true }
inspiration = { type = "checkbox" }
deathSuccesses = { type = "checkboxes", count = 3 }
deathFailures = { type = "checkboxes", count = 3 }
gold = { type = "number", min = 0, default = 0 }
attacks = { type = "list", item = "note" }
spells = { type = "list", item = "note" }
equipment = { type = "list", item = "note" }
features = { type = "longtext" }
notes = { type = "longtext" }

[derived]
proficiency = "2 + floor((min(max(level, 1), 20) - 1) / 4)"
hitDie = "lookup('classes', profile.class, 'hitDie')"
speed = "lookup('races', profile.race, 'speed')"
# a sub-choice only counts while it belongs to the current race / class
subrace = "if(has(lookup('races', profile.race, 'subraces'), profile.subrace), profile.subrace, '')"
subclass = "if(has(lookup('classes', profile.class, 'subclasses'), profile.subclass), profile.subclass, '')"
str_score = "abilities.str + lookup('races', profile.race, 'str') + lookup('subraces', subrace, 'str')"
str_mod = "floor((str_score - 10) / 2)"
save_str = "str_mod + if(saves.str, proficiency, 0)"
dex_score = "abilities.dex + lookup('races', profile.race, 'dex') + lookup('subraces', subrace, 'dex')"
dex_mod = "floor((dex_score - 10) / 2)"
save_dex = "dex_mod + if(saves.dex, proficiency, 0)"
con_score = "abilities.con + lookup('races', profile.race, 'con') + lookup('subraces', subrace, 'con')"
con_mod = "floor((con_score - 10) / 2)"
save_con = "con_mod + if(saves.con, proficiency, 0)"
int_score = "abilities.int + lookup('races', profile.race, 'int') + lookup('subraces', subrace, 'int')"
int_mod = "floor((int_score - 10) / 2)"
save_int = "int_mod + if(saves.int, proficiency, 0)"
wis_score = "abilities.wis + lookup('races', profile.race, 'wis') + lookup('subraces', subrace, 'wis')"
wis_mod = "floor((wis_score - 10) / 2)"
save_wis = "wis_mod + if(saves.wis, proficiency, 0)"
cha_score = "abilities.cha + lookup('races', profile.race, 'cha') + lookup('subraces', subrace, 'cha')"
cha_mod = "floor((cha_score - 10) / 2)"
save_cha = "cha_mod + if(saves.cha, proficiency, 0)"
skill_acrobatics = "dex_mod + if(skills.acrobatics, proficiency, 0)"
skill_animal_handling = "wis_mod + if(skills.animal_handling, proficiency, 0)"
skill_arcana = "int_mod + if(skills.arcana, proficiency, 0)"
skill_athletics = "str_mod + if(skills.athletics, proficiency, 0)"
skill_deception = "cha_mod + if(skills.deception, proficiency, 0)"
skill_history = "int_mod + if(skills.history, proficiency, 0)"
skill_insight = "wis_mod + if(skills.insight, proficiency, 0)"
skill_intimidation = "cha_mod + if(skills.intimidation, proficiency, 0)"
skill_investigation = "int_mod + if(skills.investigation, proficiency, 0)"
skill_medicine = "wis_mod + if(skills.medicine, proficiency, 0)"
skill_nature = "int_mod + if(skills.nature, proficiency, 0)"
skill_perception = "wis_mod + if(skills.perception, proficiency, 0)"
skill_performance = "cha_mod + if(skills.performance, proficiency, 0)"
skill_persuasion = "cha_mod + if(skills.persuasion, proficiency, 0)"
skill_religion = "int_mod + if(skills.religion, proficiency, 0)"
skill_sleight_of_hand = "dex_mod + if(skills.sleight_of_hand, proficiency, 0)"
skill_stealth = "dex_mod + if(skills.stealth, proficiency, 0)"
skill_survival = "wis_mod + if(skills.survival, proficiency, 0)"
initiative = "dex_mod"
passive_perception = "10 + skill_perception"
# average-roll hit points: full die at 1st level, then half die + 1 per level, plus Constitution each level;
# hill dwarves and draconic sorcerers add 1 per level
hpMax = "max(1, hitDie + con_mod + (level - 1) * (floor(hitDie / 2) + 1 + con_mod) + hpBonus + (lookup('subraces', subrace, 'hpPerLevel') + if(subclass == 'draconic', 1, 0)) * level)"
# every class / subclass / race / background feature the character has reached
featureIds = "concat(upto(lookup('classes', profile.class, 'features'), level), upto(lookup('subclasses', subclass, 'features'), level), lookup('races', profile.race, 'features'), lookup('subraces', subrace, 'features'), lookup('backgrounds', profile.background, 'features'))"
caster = "lookup('classes', profile.class, 'caster')"
spellAbility = "lookup('classes', profile.class, 'spellAbility')"
spell_mod = "if(spellAbility == 'int', int_mod, if(spellAbility == 'wis', wis_mod, if(spellAbility == 'cha', cha_mod, 0)))"
spell_dc = "if(caster == 'full' or caster == 'half' or caster == 'pact', 8 + proficiency + spell_mod, 0)"
spell_attack = "if(spell_dc > 0, proficiency + spell_mod, 0)"
slot_1 = "if(caster == 'full', table('slots_full', level)[0], if(caster == 'half', table('slots_half', level)[0], 0))"
slot_2 = "if(caster == 'full', table('slots_full', level)[1], if(caster == 'half', table('slots_half', level)[1], 0))"
slot_3 = "if(caster == 'full', table('slots_full', level)[2], if(caster == 'half', table('slots_half', level)[2], 0))"
slot_4 = "if(caster == 'full', table('slots_full', level)[3], if(caster == 'half', table('slots_half', level)[3], 0))"
slot_5 = "if(caster == 'full', table('slots_full', level)[4], if(caster == 'half', table('slots_half', level)[4], 0))"
slot_6 = "if(caster == 'full', table('slots_full', level)[5], if(caster == 'half', table('slots_half', level)[5], 0))"
slot_7 = "if(caster == 'full', table('slots_full', level)[6], if(caster == 'half', table('slots_half', level)[6], 0))"
slot_8 = "if(caster == 'full', table('slots_full', level)[7], if(caster == 'half', table('slots_half', level)[7], 0))"
slot_9 = "if(caster == 'full', table('slots_full', level)[8], if(caster == 'half', table('slots_half', level)[8], 0))"
pact_slots = "if(caster == 'pact', table('pact', level)[0], 0)"
pact_level = "if(caster == 'pact', table('pact', level)[1], 0)"

