[hints]
concept = "Write the hero's name. Alignment is optional."
race = "Pick a race. It gives speed and ability bonuses."
subrace = "Pick a subrace: it adds another bonus and traits."
ancestry = "Pick the dragon you descend from."
class = "Pick a class. It sets hit die, saves, the skill list and spells."
subclass = "Pick a subclass, a specialization inside the class."
background = "Pick a background: what the hero did before adventuring."
abilities = "Set the six abilities one of three ways: point buy, standard array or rolls."
skills = "Tick the hero's skills. Skills from race and background are already ticked."
recap = "Go through the list and return to any item with a cross."

[guide]
concept = """
Only the hero's name is required. Player, campaign and alignment can be filled in later.

A name and a few words about the hero will help you choose race and class on the next steps, for example "a disgraced soldier seeking redemption". Alignment describes how the hero sees good and order, for example "chaotic good". You can leave it empty.
"""
race = """
Pick a race from the list. The race sets speed and gives ability bonuses. Those bonuses are added on the sheet automatically, so do not include them in your scores.

A half-elf also gets two +1 bonuses of their choice. Add those by hand to the base scores on the Abilities step.
"""
subrace = """
Your race has a subrace. Pick one: it adds another ability bonus and its own traits. The traits appear on the sheet in the features section.
"""
ancestry = """
Pick the dragon the hero descends from. It sets the damage type and shape of the breath weapon, and the damage resistance.
"""
class = """
Pick a class. It decides what the hero can do. The class sets the hit die, two saving throws, the skill list you choose from, and spells. The features of your level appear on the sheet automatically.

The level starts at 1. If the DM starts higher, set it here.
"""
subclass = """
A subclass is a specialization inside the class. It is chosen at a set level: clerics, sorcerers and warlocks choose at level 1, druids and wizards at level 2, the rest at level 3. If this step is missing, the hero's level is still too low. Subclass features appear on the sheet from the right level.

If the subclass you want is not in the list, pick "Other" and write its name.
"""
background = """
The background describes what the hero did before adventuring. It gives two skills and a feature. The list has the SRD Acolyte and twelve more backgrounds from the Player's Handbook. Each gives two skills and a feature, and the skills are ticked for you. The "Custom" option lets you pick any two skills on the Skills step.
"""
abilities = """
The hero has six ability scores. Choose how you will set them and switch to the matching tab.

- Point buy: you have 27 points, each score from 8 to 15. The higher the score, the more a point costs.
- Standard array: hand out the values 15, 14, 13, 12, 10 and 8, each once.
- Rolls: 4d6, drop the lowest, six times. Ask the DM whether rolls are allowed.

Race bonuses are added on the sheet automatically, so do not include them in these values.
"""
skills = """
Tick the skills the hero is proficient in. The counter shows how many you can pick, which the class decides. You can only choose from the class skill list. Skills from race and background, and the class saving throws, are already ticked and do not count. The proficiency bonus is added to every ticked skill automatically.
"""
recap = "Go through the list. An item with a cross can be fixed: tap it to return to that step."

