[hints]
concept = "Who is your hero? A name and an alignment."
race = "Race gives ability bonuses and speed."
subrace = "A race variant: one more bonus and extra traits."
ancestry = "The dragon you descend from."
class = "Class sets hit die, saving throws, skills and spellcasting."
subclass = "A specialisation within the class."
background = "What your hero did before adventuring."
abilities = "Six ability scores: point buy, standard array or rolls."
skills = "Tick the skills your hero is proficient in. Skills from class and background are already ticked."
recap = "Check the summary."

[guide]
concept = "A name and a few words about the hero are enough to start, for example \"disgraced soldier seeking redemption\". Alignment is how the hero sees right and wrong, and it's optional."
race = "Race gives ability bonuses and speed, and the bonuses are added on the sheet for you. Half-elves also pick two extra +1 bonuses, which you add to the base scores yourself."
subrace = "Some races have a variant that adds one more ability bonus and some traits. They show up on the sheet under Features & traits."
ancestry = "Your dragon ancestor sets the damage type and shape of your breath weapon, and your damage resistance."
class = """
Class is what the hero can do. It sets the hit die, two saving throws, the skill list and spellcasting. Features up to your level appear on the sheet by themselves.

Level 1 is the default; raise it if your DM starts higher."""
subclass = "Clerics, sorcerers and warlocks choose a subclass at 1st level, druids and wizards at 2nd, everyone else at 3rd. Its features appear on the sheet from the level they unlock. If your subclass isn't in the list, pick Other and type its name."
background = "A background gives skills and a feature. The SRD has only the Acolyte (Insight and Religion). Custom lets you choose any two skills on the Skills step."
abilities = """
There are three ways to set your scores.

Point buy: 27 points, each score from 8 to 15. Standard array: 15, 14, 13, 12, 10 and 8, once each. Roll: 4d6 drop the lowest, six times; ask your DM first.

Racial bonuses are added on the sheet for you."""
skills = "Pick skills from your class list, as many as it allows (that is the budget). Skills from your race and background, and your class saving throws, are already ticked. Your proficiency bonus is added to every ticked skill."
recap = "Anything marked with a cross can be fixed: tap it to jump to the right step."

