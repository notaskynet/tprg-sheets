[guide]
abilities = """
**Три способа задать значения.**

- **Покупка очков:** 27 очков, каждое значение 8–15. Предсказуемо и сбалансировано.
- **Стандартный набор:** распределите 15, 14, 13, 12, 10, 8 по одному разу.
- **Броски:** 4d6, отбросить меньший, шесть раз. Рискованно, спросите мастера.

Расовые бонусы прибавляются автоматически на листе."""
skills = """
Выберите столько навыков, сколько разрешает класс (это бюджет). **Бонус мастерства** прибавляется ко всем отмеченным навыкам."""
