[hints]
concept = "Who is your hero? Name, background and alignment."
race = "Race grants ability bonuses and speed."
class = "Class sets your hit die, skill choices and playstyle."
abilities = "Set the six ability scores: point buy, standard array or rolls."
skills = "Tick the skills you are proficient in."
saves = "Tick the two saving throws your class grants."
recap = "Check the summary."

[guide]
abilities = """
**Three ways to set your scores.**

- **Point buy:** 27 points, each score 8–15. Predictable and balanced.
- **Standard array:** assign 15, 14, 13, 12, 10, 8 once each.
- **Roll:** 4d6 drop the lowest, six times. Swingy, ask your DM first.

Racial bonuses are added automatically on the sheet."""
skills = """
Pick as many skills as your class allows (shown as the budget). Your **proficiency bonus** is added to every skill you tick."""

concept = """
**Start with who they are.** A name, a background (what they did before adventuring) and an alignment (how they see right and wrong).

A one-line idea is enough: *“disgraced soldier seeking redemption”*."""
race = """
**Race gives bonuses and speed.** Racial ability bonuses are added to your scores automatically on the sheet.

Half-Elves also choose two extra +1 bonuses: add those to your base scores yourself."""
class = """
**Class is what your hero does.** It sets the hit die (hit points per level) and how many skills you choose.

Level 1 is the default; raise it if your DM starts higher."""
saves = """
**Tick the two saving throws your class grants** (they are listed in the class description). Your proficiency bonus is added to each."""
recap = """
**Check the summary.** Anything marked with a cross can be fixed: tap it to jump to its step."""

[desc.alignments]
lg = "Acts by a code of honour and does good."
ng = "Does the best they can for others."
cg = "Follows their conscience, free of rules."
ln = "Order and tradition above all."
n = "Balanced, avoids taking sides."
cn = "Free spirit, unpredictable."
le = "Methodical, ruthless domination."
ne = "Self-serving, no loyalties."
ce = "Destruction and cruelty on a whim."

[help]
"profile.name" = "Your hero's name."
"profile.player" = "Your own name, so the table knows who plays whom."
"profile.background" = "What your hero did before adventuring. Pick the SRD one or write your own."
"profile.alignment" = "A shorthand for how your hero sees ethics and order. Optional flavour."
"profile.race" = "Gives ability score bonuses and your speed."
"profile.class" = "What your hero does best. Sets hit die and skill choices."
"level" = "Current level, 1–20. New heroes start at 1 unless your DM says otherwise."
