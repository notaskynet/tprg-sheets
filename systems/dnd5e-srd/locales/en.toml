"profile.background" = "Gives skills and a feature. The SRD has Acolyte; Custom lets you choose any two extra skills."
"profile.alignment" = "A shorthand for how your hero sees ethics and order. Optional flavour."
"profile.race" = "Gives ability score bonuses and your speed."
"profile.class" = "What your hero does best. Sets hit die, saving throws, skill list and spellcasting."
level = "Current level, 1–20. New heroes start at 1 unless your DM says otherwise."
"profile.subrace" = "Some races have a variant that adds a bonus and traits."
"profile.ancestry" = "Your dragon ancestor sets the damage type and shape of your breath weapon."
"profile.subclass" = "Your specialisation within the class; its features appear on the sheet from the level they unlock."

