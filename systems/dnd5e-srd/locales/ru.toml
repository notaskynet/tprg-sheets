[guide]
concept = """
Обязательно только имя героя. Игрока, кампанию и мировоззрение можно заполнить позже.

Имя и пара слов о герое помогут выбрать расу и класс на следующих шагах, например «опальный солдат, ищущий искупления». Мировоззрение описывает, как герой смотрит на добро и порядок, например «хаотично-добрый». Это поле можно оставить пустым.
"""
race = """
Выберите расу из списка. Раса определяет скорость и даёт бонусы к характеристикам. Эти бонусы прибавляются на листе сами, учитывать их в значениях не нужно.

Полуэльф получает ещё два бонуса +1 к характеристикам на свой выбор. Их нужно прибавить вручную к базовым значениям на шаге «Характеристики».
"""
subrace = """
У выбранной расы есть подраса. Выберите её: она добавит ещё один бонус к характеристике и свои черты. Черты появятся на листе в разделе «Умения и особенности».
"""
ancestry = """
Выберите дракона, от которого происходит герой. От него зависят тип урона и форма дыхания, а также сопротивление урону.
"""
class = """
Выберите класс. Он определяет, что герой умеет. От класса зависят кость хитов, два спасброска, список навыков, из которых вы выберете свои, и заклинания. Умения вашего уровня появятся на листе сами.

Уровень по умолчанию 1. Если мастер начинает с более высокого, поставьте его здесь.
"""
subclass = """
Подкласс это специализация внутри класса. Он выбирается на определённом уровне: клирик, чародей и колдун выбирают его на 1-м, друид и волшебник на 2-м, остальные на 3-м. Если этого шага нет, уровень героя пока слишком низкий. Умения подкласса появятся на листе с нужного уровня.

Если нужного подкласса нет в списке, выберите «Другой» и впишите его название.
"""
background = """
Предыстория описывает, чем герой занимался до приключений. Она даёт два навыка и особенность. В списке есть Послушник из SRD и ещё двенадцать предысторий из Книги игрока. У каждой два навыка и особенность, навыки отметятся сами. Вариант «Своя» позволяет выбрать любые два навыка на шаге «Навыки».
"""
abilities = """
У героя шесть характеристик. Выберите способ, которым вы зададите их значения, и перейдите на нужную вкладку.

- Покупка очков: у вас 27 очков, каждое значение от 8 до 15. Чем выше значение, тем дороже очко.
- Стандартный набор: раздайте значения 15, 14, 13, 12, 10 и 8, каждое по одному разу.
- Броски: 4d6 с отбрасыванием наименьшего, шесть раз. Спросите мастера, разрешены ли они.

Бонусы расы прибавляются на листе сами, поэтому не учитывайте их в этих значениях.
"""
skills = """
Отметьте навыки, в которых герой будет мастером. Сколько навыков можно выбрать, показывает счётчик, число определяет класс. Выбирать можно только из списка навыков класса. Навыки расы и предыстории, а также спасброски класса уже отмечены и в счёт не идут. Бонус мастерства прибавляется ко всем отмеченным навыкам сам.
"""
recap = "Пройдите по списку. Пункт с крестиком можно исправить: нажмите на него, и вы вернётесь на нужный шаг."

