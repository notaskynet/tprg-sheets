[hints]
concept = "Кто ваш герой? Имя и мировоззрение."
race = "Раса даёт бонусы к характеристикам и скорость."
subrace = "Вариант расы: ещё один бонус и дополнительные черты."
ancestry = "Дракон, от которого вы произошли."
class = "Класс определяет кость хитов, спасброски, навыки и заклинания."
subclass = "Специализация внутри класса."
background = "Чем герой занимался до приключений."
abilities = "Шесть характеристик: покупка очков, стандартный набор или броски."
skills = "Отметьте навыки, в которых герой мастер. Навыки от класса и предыстории уже отмечены."
recap = "Проверьте итоги."

[guide]
concept = "Для начала хватит имени и пары слов о герое, например «опальный солдат, ищущий искупления». Мировоззрение описывает, как герой смотрит на добро и зло, и необязательно."
race = "Раса даёт бонусы к характеристикам и скорость, бонусы прибавляются на листе сами. Полуэльфы выбирают ещё два бонуса +1, их нужно прибавить к базовым значениям вручную."
subrace = "У некоторых рас есть вариант: он добавляет ещё один бонус к характеристике и черты. Они появятся на листе в разделе «Умения и особенности»."
ancestry = "Драконий предок определяет тип урона и форму оружия дыхания, а также сопротивление урону."
class = """
Класс определяет, что герой умеет. От него зависят кость хитов, два спасброска, список навыков и заклинания. Умения до вашего уровня появляются на листе сами.

Уровень по умолчанию 1, повысьте его, если мастер начинает с большего."""
subclass = "Клирик, чародей и колдун выбирают подкласс на 1-м уровне, друид и волшебник на 2-м, остальные на 3-м. Умения подкласса появляются на листе с нужного уровня. Если нужного подкласса нет в списке, выберите «Другой» и впишите название."
background = "Предыстория даёт навыки и особенность. В SRD есть только Послушник (Проницательность и Религия). «Своя» позволяет выбрать любые два навыка на шаге «Навыки»."
abilities = """
Значения можно задать тремя способами.

Покупка очков: 27 очков, каждое значение от 8 до 15. Стандартный набор: 15, 14, 13, 12, 10 и 8 по одному разу. Броски: 4d6, отбросить наименьший, шесть раз; спросите мастера, разрешены ли они.

Бонусы расы прибавляются на листе сами."""
skills = "Выберите навыки из списка класса, сколько он позволяет (это бюджет). Навыки расы и предыстории и спасброски класса уже отмечены. Бонус мастерства прибавляется ко всем отмеченным навыкам."
recap = "Всё, что отмечено крестиком, можно исправить: нажмите на пункт, и вы перейдёте к нужному шагу."

