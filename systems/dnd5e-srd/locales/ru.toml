[hints]
concept = "Кто ваш герой? Имя, предыстория и мировоззрение."
race = "Раса даёт бонусы к характеристикам и скорость."
class = "Класс определяет кость хитов, число навыков и стиль игры."
abilities = "Задайте шесть характеристик: покупка очков, стандартный набор или броски."
skills = "Отметьте навыки, в которых вы мастер."
saves = "Отметьте два спасброска, которые даёт ваш класс."
recap = "Проверьте итоги."

[guide]
abilities = """
**Три способа задать значения.**

- **Покупка очков:** 27 очков, каждое значение 8–15. Предсказуемо и сбалансировано.
- **Стандартный набор:** распределите 15, 14, 13, 12, 10, 8 по одному разу.
- **Броски:** 4d6, отбросить меньший, шесть раз. Рискованно, спросите мастера.

Расовые бонусы прибавляются автоматически на листе."""
skills = """
Выберите столько навыков, сколько разрешает класс (это бюджет). **Бонус мастерства** прибавляется ко всем отмеченным навыкам."""

concept = """
**Начните с того, кто это.** Имя, предыстория (чем занимался до приключений) и мировоззрение (как видит добро и зло).

Достаточно одной строки: *«опальный солдат в поисках искупления»*."""
race = """
**Раса даёт бонусы и скорость.** Расовые бонусы к характеристикам прибавляются автоматически на листе.

Полуэльфы дополнительно выбирают два бонуса +1: добавьте их к базовым значениям сами."""
class = """
**Класс определяет, что умеет герой.** Он задаёт кость хитов (здоровье за уровень) и число выбираемых навыков.

По умолчанию 1 уровень; повысьте, если мастер начинает с более высокого."""
saves = """
**Отметьте два спасброска вашего класса** (они указаны в описании класса). К каждому прибавляется бонус мастерства."""
recap = """
**Проверьте итоги.** Всё, что отмечено крестиком, можно исправить: нажмите на пункт, чтобы перейти к шагу."""

